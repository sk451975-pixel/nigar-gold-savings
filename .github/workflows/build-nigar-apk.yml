name: Build NIGAR Gold Savings APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort
          echo "========================="

      - name: Check Gradle files
        run: |
          echo "===== GRADLE FILES ====="
          find . -maxdepth 4 -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print
          echo "========================"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Check Gradle tasks
        run: |
          echo "===== AVAILABLE APP TASKS ====="
          gradle :app:tasks --all --no-daemon
          echo "================================"

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --refresh-dependencies

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print
          echo "===================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGAR-Gold-Savings-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
