name: Build NIGAR Gold Savings APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find Android SDK already installed on GitHub runner
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
            elif [ -d "$HOME/Android/Sdk" ]; then
              export ANDROID_HOME="$HOME/Android/Sdk"
            fi
          fi

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME was not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "SDK manager found in latest"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
            echo "SDK manager found in 16.0"
          else
            echo "Searching for sdkmanager..."
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found"
              exit 1
            fi

            echo "Found sdkmanager at:"
            echo "$SDKMANAGER"

            echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi

      # 4. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          SDKMANAGER="${SDKMANAGER:-$(command -v sdkmanager)}"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."

      # 5. Install only valid SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="${SDKMANAGER:-$(command -v sdkmanager)}"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # 6. Make Gradle executable
      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      # 7. Clean project
      - name: Clean project
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      # 8. Build debug APK
      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGAR-Gold-Savings-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
