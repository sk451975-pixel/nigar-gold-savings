name: Build NIGAR Gold Savings APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-v4-corrected

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract corrected Android project
        run: |
          ZIP="NIGAR-Gold-Savings-Android-v4.0.2-Corrected-Project-FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Corrected project ZIP not found:"
            echo "$ZIP"
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf /tmp/nigar-corrected
          mkdir -p /tmp/nigar-corrected

          unzip -q "$ZIP" -d /tmp/nigar-corrected

          PROJECT_ROOT=$(find /tmp/nigar-corrected -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            find /tmp/nigar-corrected -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Corrected project found at:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. ./

      - name: Verify corrected project
        run: |
          echo "===== SETTINGS ====="
          ls -l settings.gradle* 2>/dev/null || true

          echo "===== APP ====="
          find app -maxdepth 4 -type f | sort

          echo "===== MAIN ACTIVITY ====="
          grep -R "WebViewAssetLoader\|appassets.androidplatform.net" \
            app/src/main/java 2>/dev/null || true

          echo "===================="

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Build APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print
          echo "===================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGAR-Gold-Savings-APK-Corrected
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
