name: Build NIGAR Gold Savings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'NIGAR_Gold_Savings_Android_Project.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "NIGAR_Gold_Savings_Android_Project.zip was not found."
            exit 1
          fi
          rm -rf build_project
          mkdir -p build_project
          unzip -q "$ZIP_FILE" -d build_project
          cd build_project/NIGAR_Gold_Savings_Android
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGAR-Gold-Savings-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
