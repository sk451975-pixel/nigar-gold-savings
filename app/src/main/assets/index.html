<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7d0920"><title>NIGAR Gold Savings</title><style>:root{--m:#7d0920;--g:#f5c84b;--bg:#fff9f4;--line:#eadcdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:#24171a}header{background:var(--m);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:1px}.brand small{display:block;font-size:10px;letter-spacing:2px}.wrap{max-width:1050px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:14px}.nav button{white-space:nowrap}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat b{font-size:24px}button{padding:10px 13px;border:0;border-radius:9px;background:#fff;border:1px solid var(--line);cursor:pointer}.primary{background:var(--m);color:#fff}.gold{background:var(--g)}.danger{color:#b42318;background:#fff0ef}input,select,textarea{width:100%;padding:10px;border:1px solid #d9c9cd;border-radius:9px;margin:4px 0 10px}label{font-size:13px;font-weight:700}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table{overflow:auto}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:420px;width:100%;text-align:center;padding:28px}.logo{width:60px;height:60px;border-radius:50%;background:var(--g);color:var(--m);display:grid;place-items:center;margin:auto;font-size:28px;font-weight:900}.hide{display:none}.muted{color:#6e6265;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.receipt{max-width:700px;margin:auto;background:#fff;padding:25px;border:1px solid #ddd}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media print{header,.nav,.no-print{display:none!important}.wrap{padding:0}}</style></head><body><div id="app"></div><script>
const appEl=document.getElementById('app');
const K='nigar_gold_local_v1';let S=JSON.parse(localStorage.getItem(K)||'{"customers":[],"payments":[],"users":[{"id":"admin","pass":"1234","name":"Administrator","role":"admin"}]}');const save=()=>localStorage.setItem(K,JSON.stringify(S));const $=x=>document.querySelector(x);const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(+n||0);const today=()=>new Date().toISOString().slice(0,10);const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function toast(x){let d=document.createElement('div');d.textContent=x;d.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:10px;z-index:99';document.body.append(d);setTimeout(()=>d.remove(),1800)}
function login(){appEl.innerHTML='<div class="login"><div class="card"><div class="logo">N</div><h1 style="color:var(--m)">NIGAR Gems & Jewellers</h1><p>Gold Savings Business System</p><label>Staff ID</label><input id="u" value="admin"><label>Password</label><input id="p" type="password" value="1234"><button class="primary" onclick="doLogin()">Login</button><p class="muted">Default: admin / 1234</p></div></div>'}function doLogin(){let u=S.users.find(x=>x.id==$('#u').value&&x.pass==$('#p').value);if(!u)return toast('Invalid login');sessionStorage.nigar=JSON.stringify(u);home('dashboard')}function logout(){sessionStorage.removeItem('nigar');login()}
function home(page){appEl.innerHTML='<header><div class="brand">◆ NIGAR<small>GEMS & JEWELLERS</small></div><button class="gold" onclick="logout()">Logout</button></header><div class="wrap"><div class="nav">'+['dashboard','customers','payments','passbook','receipts','ledger','reports','staff','backup'].map(x=>'<button class="'+(x==page?'primary':'')+'" onclick="home(\''+x+'\')">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div><main id="main"></main></div>';window[page]()}function customer(id){return S.customers.find(x=>x.id==id)}
function dashboard(){let t=S.payments.reduce((a,p)=>a+ +p.amount,0);main.innerHTML='<h2>Dashboard</h2><div class="grid"><div class="card stat"><small>Customers</small><br><b>'+S.customers.length+'</b></div><div class="card stat"><small>Payments</small><br><b>'+S.payments.length+'</b></div><div class="card stat"><small>Total Collected</small><br><b>'+money(t)+'</b></div><div class="card stat"><small>Staff</small><br><b>'+S.users.length+'</b></div></div><div class="two"><div class="card"><h3>Quick actions</h3><button class="primary" onclick="home(\'customers\')">+ Customer</button> <button class="gold" onclick="home(\'payments\')">+ Payment</button></div><div class="card"><h3>Recent payments</h3>'+(S.payments.slice(-5).reverse().map(p=>'<div class="row"><span>'+esc(customer(p.customerId)?.name||'Unknown')+'</span><b>'+money(p.amount)+'</b><span class="muted">'+p.date+'</span></div>').join('')||'No payments yet')+'</div></div>'}
function customers(){main.innerHTML='<div class="row"><h2 style="flex:1">Customers</h2><button class="primary" onclick="editCustomer()">+ New Customer</button></div><div class="card"><input id="q" placeholder="Search name / phone / ID" oninput="drawCustomers()"><div id="ct"></div></div>';drawCustomers()}function drawCustomers(){let q=($('#q')?.value||'').toLowerCase(),a=S.customers.filter(c=>(c.name+c.phone+c.id).toLowerCase().includes(q));$('#ct').innerHTML='<div class="table"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Plan</th><th></th></tr>'+a.map(c=>'<tr><td>'+c.id+'</td><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.plan)+'</td><td><button onclick="editCustomer(\''+c.id+'\')">Edit</button> <button onclick="home(\'passbook\');setTimeout(()=>showPB(\''+c.id+'\'),0)">Passbook</button></td></tr>').join('')+'</table></div>'}function editCustomer(id=''){let c=customer(id)||{};main.innerHTML='<h2>'+(id?'Edit':'New')+' Customer</h2><div class="card"><div class="two"><div><label>Name</label><input id="n" value="'+esc(c.name||'')+'"><label>Phone</label><input id="ph" value="'+esc(c.phone||'')+'"><label>Address</label><textarea id="ad">'+esc(c.address||'')+'</textarea></div><div><label>Customer ID</label><input id="cid" value="'+(c.id||('CUS'+Date.now().toString().slice(-6)))+'" '+(id?'readonly':'')+'><label>Scheme</label><input id="pl" value="'+esc(c.plan||'Gold Savings')+'"><label>Installment ₹</label><input id="ins" type="number" value="'+(c.install||1000)+'"><label>Duration months</label><input id="mo" type="number" value="'+(c.months||11)+'"></div></div><button class="primary" onclick="saveCustomer(\''+id+'\')">Save</button></div>'}function saveCustomer(old){let c={id:$('#cid').value,name:$('#n').value,phone:$('#ph').value,address:$('#ad').value,plan:$('#pl').value,install:+$('#ins').value,months:+$('#mo').value};if(!c.name)return toast('Enter name');let i=S.customers.findIndex(x=>x.id==old);if(i>=0)S.customers[i]=c;else S.customers.push(c);save();home('customers')}
function payments(){main.innerHTML='<h2>Add Payment</h2><div class="card">'+(S.customers.length?'<div class="two"><div><label>Customer</label><select id="pc">'+S.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' — '+c.id+'</option>').join('')+'</select><label>Amount ₹</label><input id="amt" type="number" value="1000"><label>Mode</label><select id="mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select></div><div><label>Date</label><input id="dt" type="date" value="'+today()+'"><label>Receipt No.</label><input id="rc" value="RCP'+Date.now().toString().slice(-7)+'"><label>Note</label><textarea id="nt"></textarea></div></div><button class="primary" onclick="savePayment()">Save Payment</button>':'Create a customer first.')+'</div><div class="card"><h3>Payment History</h3><div class="table"><table><tr><th>Receipt</th><th>Customer</th><th>Amount</th><th>Mode</th><th>Date</th></tr>'+S.payments.slice().reverse().map(p=>'<tr><td>'+p.receipt+'</td><td>'+esc(customer(p.customerId)?.name)+'</td><td>'+money(p.amount)+'</td><td>'+p.mode+'</td><td>'+p.date+'</td></tr>').join('')+'</table></div></div>'}function savePayment(){let p={id:String(Date.now()),customerId:$('#pc').value,amount:+$('#amt').value,mode:$('#mode').value,date:$('#dt').value,receipt:$('#rc').value,note:$('#nt').value};if(!p.amount)return toast('Enter amount');S.payments.push(p);save();toast('Payment saved');home('payments')}
function passbook(){main.innerHTML='<h2>Passbook</h2><div class="card"><label>Customer</label><select id="pbs" onchange="showPB(this.value)"><option value="">Select...</option>'+S.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' — '+c.id+'</option>').join('')+'</select></div><div id="pbo"></div>'}function showPB(id){let c=customer(id);if(!c)return;if($('#pbs'))$('#pbs').value=id;let ps=S.payments.filter(p=>p.customerId==id),t=ps.reduce((a,p)=>a+ +p.amount,0);$('#pbo').innerHTML='<div class="card"><h2>'+esc(c.name)+'</h2><p>'+c.id+' · '+esc(c.phone)+'</p><p><b>Scheme:</b> '+esc(c.plan)+' · <b>Installment:</b> '+money(c.install)+' · <b>Total Paid:</b> '+money(t)+'</p><div class="table"><table><tr><th>Date</th><th>Receipt</th><th>Mode</th><th>Amount</th></tr>'+ps.map(p=>'<tr><td>'+p.date+'</td><td>'+p.receipt+'</td><td>'+p.mode+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</table></div></div>'}
function receipts(){main.innerHTML='<h2>Receipt</h2><div class="card"><select id="rs" onchange="showReceipt(this.value)"><option value="">Select payment...</option>'+S.payments.slice().reverse().map(p=>'<option value="'+p.id+'">'+p.receipt+' — '+esc(customer(p.customerId)?.name)+' — '+money(p.amount)+'</option>').join('')+'</select></div><div id="ro"></div>'}function showReceipt(id){let p=S.payments.find(x=>x.id==id),c=p&&customer(p.customerId);if(!p)return;$('#ro').innerHTML='<div class="receipt" id="pr"><h1 style="color:var(--m)">NIGAR Gems & Jewellers</h1><p>Gold Savings Business System</p><hr><p><b>Receipt:</b> '+p.receipt+'</p><p><b>Date:</b> '+p.date+'</p><p><b>Customer:</b> '+esc(c.name)+'</p><p><b>Customer ID:</b> '+c.id+'</p><p><b>Mode:</b> '+p.mode+'</p><h2>Amount Paid: '+money(p.amount)+'</h2><hr><p>Thank you for saving with NIGAR Gems & Jewellers.</p><button class="primary no-print" onclick="print()">Print / Save PDF</button> <button class="gold no-print" onclick="shareWA(\''+p.id+'\')">WhatsApp</button></div>'}function shareWA(id){let p=S.payments.find(x=>x.id==id),c=customer(p.customerId);if(!p||!c)return;let m=encodeURIComponent('NIGAR Gems & Jewellers\nReceipt: '+p.receipt+'\nCustomer: '+c.name+'\nAmount: '+money(p.amount)+'\nDate: '+p.date);location.href='https://wa.me/'+c.phone.replace(/\D/g,'')+'?text='+m}
function ledger(){let t=S.payments.reduce((a,p)=>a+ +p.amount,0);main.innerHTML='<h2>Ledger</h2><div class="card"><b>Total Collected:</b> '+money(t)+'<br><b>Total Entries:</b> '+S.payments.length+'</div><div class="card table"><table><tr><th>Date</th><th>Receipt</th><th>Customer</th><th>Mode</th><th>Amount</th></tr>'+S.payments.map(p=>'<tr><td>'+p.date+'</td><td>'+p.receipt+'</td><td>'+esc(customer(p.customerId)?.name)+'</td><td>'+p.mode+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</table></div>'}function reports(){let d={};S.payments.forEach(p=>d[p.date]=(d[p.date]||0)+ +p.amount);main.innerHTML='<h2>Reports</h2><div class="card table"><table><tr><th>Date</th><th>Collection</th></tr>'+Object.entries(d).sort().reverse().map(x=>'<tr><td>'+x[0]+'</td><td>'+money(x[1])+'</td></tr>').join('')+'</table></div><button class="primary" onclick="print()">Print Report</button>'}function staff(){let me=JSON.parse(sessionStorage.nigar||'{}');if(me.role!='admin'){main.innerHTML='<div class="card">Admin access required.</div>';return}main.innerHTML='<h2>Staff</h2><div class="card"><label>Staff ID</label><input id="si"><label>Password</label><input id="sp"><label>Name</label><input id="sn"><label>Role</label><select id="sr"><option>staff</option><option>admin</option></select><button class="primary" onclick="addStaff()">Add Staff</button><hr>'+S.users.map(u=>'<p>'+esc(u.name)+' — '+u.id+' — '+u.role+'</p>').join('')+'</div>'}function addStaff(){S.users.push({id:$('#si').value,pass:$('#sp').value,name:$('#sn').value||$('#si').value,role:$('#sr').value});save();staff()}function backup(){main.innerHTML='<h2>Backup & Restore</h2><div class="card"><p>Data stays on this device.</p><button class="primary" onclick="exportData()">Export Backup</button> <input id="imp" type="file" accept=".json" onchange="importData(event)"><br><br><button class="danger" onclick="if(confirm('Delete all data?')){localStorage.removeItem(K);location.reload()}">Delete All Data</button></div>'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='nigar-gold-backup.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();home('dashboard')}catch{toast('Invalid backup')}};r.readAsText(e.target.files[0])}
function start(){sessionStorage.nigar?home('dashboard'):login()}start();</script></body></html>
