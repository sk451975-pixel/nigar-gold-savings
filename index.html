<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#65000b"><link rel="manifest" href="manifest.json"><title>Nigar Gems & Jewellers — Business System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--maroon:#65000b;--gold:#c9a227;--cream:#f7f0e7;--ink:#241b19;--muted:#766b67;--line:#e4d8cc;--white:#fff;--green:#157347;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--maroon);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.brand{display:flex;gap:12px;align-items:center}.brand img{width:48px;height:48px;border-radius:10px;object-fit:cover}.brand b{font-family:Georgia,serif;font-size:19px}.brand small{display:block;opacity:.8}.wrap{max-width:1200px;margin:auto;padding:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #3c17170e;padding:22px}.login .card{max-width:430px;width:100%;text-align:center}.login img{width:105px;height:105px;border-radius:18px}.title{font-family:Georgia,serif;color:var(--maroon);font-size:28px;margin:12px 0 4px}.sub{color:var(--muted)}.field{margin:12px 0;text-align:left}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6c8bc;border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--maroon);color:#fff;font-weight:700}.btn.gold{background:var(--gold);color:#241b19}.btn.ghost{background:#fff;color:var(--maroon);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px}.nav button.active{background:var(--maroon);color:#fff;border-color:var(--maroon)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat b{font-size:25px;display:block;color:var(--maroon)}.stat span{font-size:13px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input{flex:1;min-width:200px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{background:#fbf8f4}.badge{padding:4px 8px;border-radius:999px;background:#eee;font-size:11px;font-weight:700}.badge.sent{background:#dff5e8;color:var(--green)}.badge.pending{background:#fff1c7}.badge.failed{background:#ffe1df;color:var(--red)}.hide{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:50}.modal .card{width:min(720px,100%);max-height:90vh;overflow:auto}.receipt{background:#fff;border:1px dashed #999;padding:24px;max-width:520px;margin:auto}.receipt h2{text-align:center;color:var(--maroon);font-family:Georgia,serif}.receipt .line{display:flex;justify-content:space-between;border-bottom:1px dotted #bbb;padding:8px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#241b19;color:#fff;padding:11px 16px;border-radius:10px;z-index:100;box-shadow:0 8px 30px #0004}.danger{color:var(--red)}.muted{color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.top{position:static}}@media(max-width:500px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.brand b{font-size:15px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hide"></div>
<script src="config.js"></script>
<script>
const C=window.NIGAR_CONFIG||{};
const sb=supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const toast=(m)=>{const x=document.getElementById('toast');x.textContent=m;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),2600)};
let state={user:null,profile:null,customers:[],payments:[],schemes:[],tab:'dashboard',selected:null};
function shell(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><img src="logo.jpg"><div><b>NIGAR GEMS & JEWELLERS</b><small>Gold Savings Business System • Kafla Bazar, Cuttack</small></div></div><button class="btn ghost" id="logout">Logout</button></header><main class="wrap"><div class="nav"><button data-tab="dashboard">Dashboard</button><button data-tab="customers">Customers</button><button data-tab="payments">Payments</button>${state.profile?.role==='admin'?'<button data-tab="staff">Admin / Staff</button>':''}</div><section id="content"></section></main>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('logout').onclick=async()=>{await sb.auth.signOut()};render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const c=document.getElementById('content');if(state.tab==='dashboard')c.innerHTML=dashboard();if(state.tab==='customers')c.innerHTML=customersView();if(state.tab==='payments')c.innerHTML=paymentsView();if(state.tab==='staff')c.innerHTML=staffView();bindView();}
function dashboard(){const total=state.payments.reduce((a,p)=>a+Number(p.amount),0);const today=new Date().toISOString().slice(0,10);const td=state.payments.filter(p=>p.payment_date.slice(0,10)===today).reduce((a,p)=>a+Number(p.amount),0);return `<div class="grid"><div class="card stat"><b>${state.customers.length}</b><span>Total Customers</span></div><div class="card stat"><b>${state.payments.length}</b><span>Total Payments</span></div><div class="card stat"><b>${money(total)}</b><span>Total Collection</span></div><div class="card stat"><b>${money(td)}</b><span>Today's Collection</span></div></div><div class="two" style="margin-top:14px"><div class="card"><h3>Quick actions</h3><div class="toolbar"><button class="btn" id="newCustomer">+ New Customer</button><button class="btn gold" id="newPayment">+ Record Payment</button></div><p class="muted">Every payment gets a unique receipt number and can trigger a WhatsApp confirmation.</p></div><div class="card"><h3>Business details</h3><p><b>Nigar Gems & Jewellers</b><br>Kafla Bazar, Cuttack, Odisha<br>7978786142<br>nigarjewellers.in@gmail.com<br>GSTIN: 21AGAFS5666G1Z0</p></div></div>`}
function customersView(){return `<div class="card"><div class="toolbar"><input id="custSearch" placeholder="Search customer name, code or phone..."><button class="btn" id="newCustomer">+ New Customer</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Code</th><th>Customer</th><th>Phone</th><th>Scheme</th><th>Start</th><th>Action</th></tr></thead><tbody>${state.customers.map(c=>`<tr><td>${esc(c.customer_code)}</td><td><b>${esc(c.full_name)}</b><br><span class="muted">${esc(c.email||'')}</span></td><td>${esc(c.phone)}</td><td>${esc(c.schemes?.name||'—')} ${c.schemes?`(${c.schemes.duration_months}m • ${money(c.schemes.installment_amount)})`:''}</td><td>${esc(c.start_date)}</td><td><button class="btn ghost" data-customer="${c.id}">View</button></td></tr>`).join('')}</tbody></table></div></div>`}
function paymentsView(){return `<div class="card"><div class="toolbar"><input id="paySearch" placeholder="Search receipt, customer or phone..."><button class="btn" id="newPayment">+ Record Payment</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Amount</th><th>Mode</th><th>WhatsApp</th><th>Action</th></tr></thead><tbody>${state.payments.map(p=>`<tr><td>${esc(p.receipt_no)}</td><td>${new Date(p.payment_date).toLocaleString('en-IN')}</td><td>${esc(p.customers?.full_name||'')}<br>${esc(p.customers?.phone||'')}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.payment_mode)}</td><td><span class="badge ${esc(p.whatsapp_status)}">${esc(p.whatsapp_status)}</span></td><td><button class="btn ghost" data-receipt="${p.id}">Receipt</button></td></tr>`).join('')}</tbody></table></div></div>`}
function staffView(){return `<div class="card"><h3>Admin / Staff</h3><p class="muted">Staff accounts are created in Supabase Authentication. This page lets an admin change application roles.</p><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Save</th></tr></thead><tbody>${state.profilesAll?.map(p=>`<tr><td>${esc(p.full_name||'')}</td><td>${esc(p.phone||'')}</td><td><select data-role="${p.id}"><option ${p.role==='staff'?'selected':''}>staff</option><option ${p.role==='admin'?'selected':''}>admin</option></select></td><td><button class="btn" data-save-role="${p.id}">Save</button></td></tr>`).join('')||''}</tbody></table></div></div>`}
function bindView(){document.getElementById('newCustomer')?.addEventListener('click',()=>customerModal());document.getElementById('newPayment')?.addEventListener('click',()=>paymentModal());document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>customerModal(state.customers.find(x=>x.id===b.dataset.customer)));document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receiptModal(state.payments.find(x=>x.id===b.dataset.receipt)));document.getElementById('custSearch')?.addEventListener('input',e=>filterCustomers(e.target.value));document.getElementById('paySearch')?.addEventListener('input',e=>filterPayments(e.target.value));document.querySelectorAll('[data-save-role]').forEach(b=>b.onclick=()=>saveRole(b.dataset.saveRole));}
function filterCustomers(q){q=q.toLowerCase();document.querySelectorAll('[data-customer]').forEach(b=>{const tr=b.closest('tr');tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none'})}
function filterPayments(q){q=q.toLowerCase();document.querySelectorAll('[data-receipt]').forEach(b=>{const tr=b.closest('tr');tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none'})}
function customerModal(c={}){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="toolbar"><h2 style="margin:0">${c.id?'Customer details':'New customer'}</h2><button class="btn ghost" id="close">Close</button></div><div class="three"><div class="field"><label>Customer Code *</label><input id="ccode" value="${esc(c.customer_code||('NGJ-'+Date.now().toString().slice(-6)))}"></div><div class="field"><label>Full Name *</label><input id="cname" value="${esc(c.full_name)}"></div><div class="field"><label>Mobile *</label><input id="cphone" value="${esc(c.phone)}"></div></div><div class="three"><div class="field"><label>Email</label><input id="cemail" value="${esc(c.email)}"></div><div class="field"><label>ID / KYC No.</label><input id="cid" value="${esc(c.id_number)}"></div><div class="field"><label>Start Date</label><input type="date" id="cdate" value="${esc(c.start_date||new Date().toISOString().slice(0,10))}"></div></div><div class="field"><label>Address</label><textarea id="caddress">${esc(c.address)}</textarea></div><div class="field"><label>Gold Savings Plan</label><select id="cscheme"><option value="">Select scheme</option>${state.schemes.map(s=>`<option value="${s.id}" ${c.scheme_id===s.id?'selected':''}>${esc(s.name)} • ${s.duration_months} months • ${money(s.installment_amount)}/month</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea id="cnotes">${esc(c.notes)}</textarea></div><button class="btn" id="saveCustomer">Save Customer</button></div></div>`);document.getElementById('close').onclick=()=>document.getElementById('modal').remove();document.getElementById('saveCustomer').onclick=async()=>{const row={customer_code:ccode.value.trim(),full_name:cname.value.trim(),phone:cphone.value.trim(),email:cemail.value.trim()||null,id_number:cid.value.trim()||null,start_date:cdate.value,address:caddress.value.trim()||null,scheme_id:cscheme.value||null,notes:cnotes.value.trim()||null,created_by:state.user.id};if(!row.full_name||!row.phone)return toast('Name and mobile are required');const {error}=c.id?await sb.from('customers').update(row).eq('id',c.id):await sb.from('customers').insert(row);if(error)return toast(error.message);document.getElementById('modal').remove();await loadData();toast('Customer saved');};}
async function paymentModal(){if(!state.customers.length)return toast('Create a customer first');document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="toolbar"><h2 style="margin:0">Record payment</h2><button class="btn ghost" id="close">Close</button></div><div class="field"><label>Customer *</label><select id="pcustomer"><option value="">Select customer</option>${state.customers.map(c=>`<option value="${c.id}">${esc(c.customer_code)} — ${esc(c.full_name)} — ${esc(c.phone)}</option>`).join('')}</select></div><div class="three"><div class="field"><label>Amount *</label><input type="number" id="pamount" min="1" step="1"></div><div class="field"><label>Payment Mode</label><select id="pmode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Card</option></select></div><div class="field"><label>Payment Date</label><input type="datetime-local" id="pdate" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div></div><div class="field"><label>Remarks</label><textarea id="premark"></textarea></div><button class="btn green" id="savePayment">Save & Generate Receipt</button></div></div>`);document.getElementById('close').onclick=()=>document.getElementById('modal').remove();document.getElementById('savePayment').onclick=async()=>{const customer_id=pcustomer.value,amount=Number(pamount.value);if(!customer_id||!amount)return toast('Select customer and enter amount');const {data,error}=await sb.from('payments').insert({customer_id,amount,payment_mode:pmode.value,payment_date:new Date(pdate.value).toISOString(),remarks:premark.value.trim()||null,created_by:state.user.id}).select('*').single();if(error)return toast(error.message);document.getElementById('modal').remove();await loadData();const p=state.payments.find(x=>x.id===data.id);receiptModal(p,true);try{const r=await sb.functions.invoke('send-whatsapp',{body:{paymentId:data.id}});if(!r.error&&r.data?.ok){await loadData();toast('Payment saved • WhatsApp sent')}else if(r.data?.notConfigured){await sb.from('payments').update({whatsapp_status:'not_configured'}).eq('id',data.id);toast('Payment saved • WhatsApp API not configured')}else{toast('Payment saved • WhatsApp not sent')}}catch(e){toast('Payment saved • WhatsApp service unavailable')}}}
function receiptModal(p,auto=false){if(!p)return;const c=p.customers||state.customers.find(x=>x.id===p.customer_id)||{};const total=state.payments.filter(x=>x.customer_id===p.customer_id).reduce((a,x)=>a+Number(x.amount),0);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="toolbar"><h2 style="margin:0">Payment receipt</h2><button class="btn ghost" id="close">Close</button></div><div class="receipt" id="receipt"><div style="text-align:center"><img src="logo.jpg" style="width:70px;height:70px;border-radius:12px"><h2>NIGAR GEMS & JEWELLERS</h2><div>Kafla Bazar, Cuttack, Odisha • 7978786142</div></div><hr><div class="line"><span>Receipt No.</span><b>${esc(p.receipt_no)}</b></div><div class="line"><span>Date</span><span>${new Date(p.payment_date).toLocaleString('en-IN')}</span></div><div class="line"><span>Customer</span><span>${esc(c.full_name)}</span></div><div class="line"><span>Mobile</span><span>${esc(c.phone)}</span></div><div class="line"><span>Payment Mode</span><span>${esc(p.payment_mode)}</span></div><div class="line"><span>Amount Received</span><b>${money(p.amount)}</b></div><div class="line"><span>Total Paid To Date</span><b>${money(total)}</b></div><p style="text-align:center;margin-top:25px">Thank you for saving with Nigar Gems & Jewellers.</p></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="print">Print</button><button class="btn gold" id="pdf">Download PDF</button><button class="btn green" id="wa">WhatsApp</button></div></div></div>`);document.getElementById('close').onclick=()=>document.getElementById('modal').remove();document.getElementById('print').onclick=()=>{const w=window.open('','_blank');w.document.write('<html><head><title>Receipt '+esc(p.receipt_no)+'</title></head><body>'+document.getElementById('receipt').outerHTML+'</body></html>');w.document.close();w.print()};document.getElementById('pdf').onclick=()=>downloadPdf(p,c,total);document.getElementById('wa').onclick=()=>openWhatsApp(p,c,total);}
function openWhatsApp(p,c,total){const phone=String(c.phone||'').replace(/\D/g,'');const to=phone.startsWith('91')?phone:'91'+phone;const text=`Nigar Gems & Jewellers\nPayment Confirmation\nReceipt: ${p.receipt_no}\nCustomer: ${c.full_name}\nAmount: ${money(p.amount)}\nTotal Paid: ${money(total)}\nPayment Mode: ${p.payment_mode}\nThank you.\nKafla Bazar, Cuttack\n7978786142`;window.open(`https://wa.me/${to}?text=${encodeURIComponent(text)}`,'_blank')}
async function downloadPdf(p,c,total){const {jsPDF}=window.jspdf;const d=new jsPDF();d.setTextColor(101,0,11);d.setFontSize(18);d.text('NIGAR GEMS & JEWELLERS',105,25,{align:'center'});d.setTextColor(36,27,25);d.setFontSize(10);d.text('Kafla Bazar, Cuttack, Odisha | 7978786142',105,33,{align:'center'});d.line(20,40,190,40);let y=55;[['Receipt No.',p.receipt_no],['Date',new Date(p.payment_date).toLocaleString('en-IN')],['Customer',c.full_name],['Mobile',c.phone],['Payment Mode',p.payment_mode],['Amount Received',money(p.amount)],['Total Paid To Date',money(total)]].forEach(([a,b])=>{d.text(a,25,y);d.text(String(b),95,y);y+=10});d.text('Thank you for saving with Nigar Gems & Jewellers.',105,y+15,{align:'center'});d.save(`${p.receipt_no}.pdf`)}
async function saveRole(id){const role=document.querySelector(`[data-role="${id}"]`).value;const {error}=await sb.from('profiles').update({role}).eq('id',id);toast(error?error.message:'Role updated');if(!error)await loadProfiles()}
async function loadProfiles(){if(state.profile?.role!=='admin')return;const {data,error}=await sb.from('profiles').select('*').order('created_at');if(!error)state.profilesAll=data}
async function loadData(){const [c,p,s]=await Promise.all([sb.from('customers').select('*,schemes(name,duration_months,installment_amount)').order('created_at',{ascending:false}),sb.from('payments').select('*,customers(full_name,phone)').order('payment_date',{ascending:false}),sb.from('schemes').select('*').eq('active',true).order('name').order('duration_months').order('installment_amount')]);if(c.error)return toast(c.error.message);state.customers=c.data||[];state.payments=p.data||[];state.schemes=s.data||[];await loadProfiles();render()}
async function start(){if(!C.supabaseUrl||C.supabaseUrl.includes('YOUR-')||!C.supabaseAnonKey||C.supabaseAnonKey.includes('YOUR_')){document.getElementById('app').innerHTML='<div class="login"><div class="card"><img src="logo.jpg"><div class="title">Nigar Gems & Jewellers</div><p class="danger">Supabase is not configured yet.</p><p>Edit <b>config.js</b> and enter your Supabase project URL and publishable/anon key.</p></div></div>';return}const {data:{session}}=await sb.auth.getSession();if(!session){login();return}state.user=session.user;const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();state.profile=p||{role:'staff'};shell();await loadData()}
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="card"><img src="logo.jpg"><div class="title">NIGAR GEMS & JEWELLERS</div><h3>Gold Savings Business System</h3><p class="sub">Secure Admin / Staff Login</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@example.com"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn" id="login">Login</button><p class="muted" style="font-size:12px;margin-top:15px">Accounts are managed through Supabase Authentication.</p></div></div>`;document.getElementById('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)toast(error.message)} }
sb.auth.onAuthStateChange(()=>start());start();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
